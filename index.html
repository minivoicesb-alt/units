<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хангыль Lab — тренажёры грамматики</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.4 system-ui,"Segoe UI",sans-serif;color:#39293a;background:#fff4f8}.bar{height:64px;display:flex;align-items:center;gap:10px;padding:10px max(15px,calc((100vw - 1040px)/2));background:#fffafc;border-bottom:1px solid #f0dce5}.brand{font-weight:850;margin-right:auto;white-space:nowrap}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#fff;color:#d36998;font-style:normal;margin-right:7px}.tab{border:1px solid #efdce5;background:#fff;border-radius:12px;padding:9px 13px;color:#795080;font:inherit;font-weight:700;cursor:pointer}.tab.active{background:linear-gradient(120deg,#e47ba7,#bd72b5);color:white;border-color:transparent}iframe{display:block;width:100%;height:calc(100% - 64px);border:0;background:#fff8fa}@media(max-width:600px){.bar{height:auto;min-height:64px;flex-wrap:wrap;gap:7px}.brand{width:100%}iframe{height:calc(100% - 106px)}.tab{font-size:13px;padding:8px 10px}}</style></head><body><header class="bar"><div class="brand"><i>ㅎ</i>HANGUL LAB</div><button id="pred" class="tab active" onclick="show('pred')">Догадки и предположения</button><button id="contrast" class="tab" onclick="show('contrast')">Контраст и уступка</button></header><iframe id="lesson" title="Тренажёр корейской грамматики"></iframe><script>const docs={pred:"<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#fff4f8\">\n<title>Хангыль Lab — догадки и предположения</title>\n<style>\n:root{--ink:#38283a;--muted:#806d80;--pink:#e77da8;--rose:#fff0f5;--line:#f0dce5;--plum:#795080;--green:#25866b;--red:#c84f69;--shadow:0 18px 55px #75445b1b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",sans-serif;background:radial-gradient(ellipse at 10% 5%,#ffe4ee,transparent 36%),radial-gradient(ellipse at 95% 35%,#f2e4fb,transparent 35%),linear-gradient(140deg,#fff8fa,#fff1f6 55%,#f9f1fb);min-height:100vh}button{font:inherit;cursor:pointer;border:0}.wrap{max-width:1040px;margin:auto;padding:34px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{font-weight:800;letter-spacing:.03em}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#fff;color:#d36998;font-style:normal;margin-right:8px;box-shadow:0 5px 15px #bd6b9130}.tag{font-size:13px;color:var(--muted);background:#ffffffa8;border:1px solid #fff;padding:7px 12px;border-radius:99px}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:28px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow);backdrop-filter:blur(12px);animation:rise .45s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#c36691;font-size:12px;font-weight:800}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:10px 0 14px;letter-spacing:-.04em}.hero p{max-width:670px;color:var(--muted);margin:0}.bubble{font-size:48px;background:var(--rose);border-radius:24px;padding:15px;line-height:1}.review{margin:27px 0 25px;border:1px solid var(--line);border-radius:19px;overflow:hidden}.revrow{display:grid;grid-template-columns:190px 1fr 1.2fr;gap:16px;padding:14px 17px;border-bottom:1px solid var(--line);align-items:start}.revrow:last-child{border:0}.revrow.head{background:#fff5f8;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.gram{font-weight:800;color:#754c79}.meaning{font-size:14px}.example{font-size:14px;color:#655567}.ko{font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",sans-serif;font-size:17px;font-weight:700;color:#57345f}.translation{color:var(--muted);font-size:13px}.btn{padding:12px 19px;border-radius:14px;font-weight:750;transition:.18s transform,.18s box-shadow}.btn:hover{transform:translateY(-2px)}.primary{color:white;background:linear-gradient(120deg,#e47ba7,#bd72b5);box-shadow:0 9px 20px #cc73a442}.soft{color:#85547d;background:#f9eaf2}.muted{color:var(--muted);font-size:13px}.introline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.progress{height:9px;background:#f5e5ec;border-radius:20px;overflow:hidden;margin:7px 0 23px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#ee9ab8,#bc84c4);border-radius:inherit;transition:width .3s}.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.chip{padding:5px 10px;border-radius:99px;background:#fff0f5;color:#a7547c;font-size:12px;font-weight:750}.qtitle{font-size:clamp(21px,3vw,27px);line-height:1.35;margin:0 0 9px}.context{color:var(--muted);margin:0 0 24px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);background:#fff;border-radius:15px;color:var(--ink);transition:.15s}.option:hover:not(:disabled){border-color:#dd91b1;background:#fff8fb;transform:translateX(2px)}.option.correct{border-color:#63b59c;background:#edfaf5}.option.wrong{border-color:#df8394;background:#fff1f3}.option:disabled{cursor:default}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#f8edf3;color:#9a6286;font-size:13px;font-weight:800;margin-right:10px}.feedback{display:none;margin-top:18px;border-radius:16px;padding:15px 17px;background:#eff9f5;border:1px solid #d4eee4}.feedback.bad{background:#fff3f4;border-color:#f4d6dc}.feedback strong{display:block;margin-bottom:4px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}.right{margin-left:auto}.resulthead{text-align:center;padding:15px}.score{font-size:56px;font-weight:850;letter-spacing:-.06em;color:#bd6796}.stats{color:var(--muted)}.results{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:25px 0}.resultrow{border:1px solid var(--line);border-radius:15px;padding:12px 14px;background:#fff}.resultrow div:first-child{display:flex;justify-content:space-between;gap:8px;font-size:14px}.mini{height:6px;background:#f5e8ee;border-radius:10px;margin-top:9px;overflow:hidden}.mini span{display:block;height:100%;background:linear-gradient(90deg,#ec99b7,#bd83c5)}.wronglist{margin-top:24px}.wrongitem{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.wrongitem:last-child{border:0}.wrongitem b{color:#744b78}.empty{text-align:center;color:var(--muted);padding:20px}.foot{text-align:center;color:#9b8494;font-size:12px;padding-top:20px}@media(max-width:700px){.wrap{padding:19px 13px 45px}.panel{border-radius:22px}.bubble{display:none}.revrow{grid-template-columns:1fr;gap:5px;padding:12px 14px}.revrow.head{display:none}.revrow .example{border-top:1px dashed var(--line);padding-top:6px}.results{grid-template-columns:1fr}.tag{font-size:11px}.top{margin-bottom:17px}.controls .btn{padding:11px 14px}}\n</style></head><body><div class=\"wrap\"><header class=\"top\"><div class=\"brand\"><i>ㅎ</i> HANGUL LAB</div><div class=\"tag\">Грамматика · уровень средний</div></header><main id=\"app\"></main><div class=\"foot\">Практикум по корейской грамматике · прогресс хранится на этом устройстве</div></div>\n<script>\nconst grammars=[\n{ id:'appear',g:'-아/어 보이다',meaning:'Выглядеть каким-либо; впечатление по внешнему виду.',shade:'Опираемся на то, как человек или предмет выглядит.',ex:'오늘은 좀 피곤해 보여요.','ru':'Сегодня ты выглядишь немного уставшим.'},\n{ id:'shape',g:'-(으)ㄴ/는 모양이다',meaning:'Похоже, вероятно; вывод по заметным обстоятельствам.',shade:'Говорящий заключает о факте по косвенным признакам.',ex:'불이 꺼져 있네요. 다들 잔 모양이에요.','ru':'Свет выключен. Похоже, все уже легли.'},\n{ id:'teda',g:'-(으)ㄹ 테다',meaning:'Твёрдое намерение или уверенное ожидание говорящего.',shade:'Часто личное решение: «обязательно сделаю».',ex:'이번에는 꼭 합격할 테다.','ru':'В этот раз я непременно сдам.'},\n{ id:'tenikka',g:'-(으)ㄹ 테니까',meaning:'«Я/это, вероятно, …, так что…»; основание для просьбы или совета.',shade:'Первая часть задаёт причину для следующего действия.',ex:'내가 먼저 갈 테니까 천천히 와.','ru':'Я пойду первым, так что приходи не спеша.'},\n{ id:'geol',g:'-(으)ㄹ걸요',meaning:'Мягкое предположение или несогласие: «думаю, что…».',shade:'Ожидаемый ответ собеседнику, часто с уверенностью.',ex:'민수 씨도 곧 올걸요.','ru':'Думаю, Минсу тоже скоро придёт.'},\n{ id:'jul',g:'-(으)ㄴ/는/(으)ㄹ 줄 몰랐다 [알았다]',meaning:'Не знал / думал, что; неожиданное открытие или прежнее ожидание.',shade:'Сопоставляет реальность со знанием или догадкой раньше.',ex:'이 길이 이렇게 복잡할 줄 몰랐어요.','ru':'Не думал, что эта дорога такая запутанная.'},\n{ id:'jido',g:'-(으)ㄹ지도 모르다',meaning:'Возможно, может быть; одна из нескольких возможностей.',shade:'Неуверенная вероятность, без опоры на явный признак.',ex:'주말에 눈이 올지도 몰라요.','ru':'Возможно, на выходных пойдёт снег.'}\n];\n// type, grammar id, prompt, context, options, answer index, explanation\nconst raw=[\n['Естественная реплика','appear','Друг вернулся с пробежки, лицо красное, он тяжело дышит. Что сказать?','Наблюдение по внешнему виду.',['많이 피곤해 보여.','많이 피곤한 모양이야.','많이 피곤할지도 몰라.'],0,'Здесь говорящий видит усталость на лице. 모양이다 — вывод по обстоятельствам, а 지도 모르다 выражает лишь возможность.'],\n['Заполните пропуск','shape','창문이 열려 있고 바람이 많이 부네요. 누가 창문을 ___ .','Похоже, кто-то открыл окно.',['열어 보일 거예요','연 모양이에요','열지도 몰라요'],1,'Открытое окно и ветер — признаки уже совершённого действия. -ㄴ 모양이다 выводит факт; 지도 모르다 оставляет его только возможностью.'],\n['Смысл диалога','geol','가: 지수 씨가 오늘 회의에 안 왔어요. 나: 감기 때문에 집에 있을걸요.','Что подразумевает второй собеседник?',['Он уверен по видимому признаку, что она дома.','Он предполагает, что она дома, и мягко отвечает собеседнику.','Он обещает остаться дома вместо неё.'],1,'-을걸요 — мягкое предположение в ответе. Для вывода по конкретным признакам подошло бы -는 모양이다.'],\n['Точный перевод','jido','아직 출발하지 않으면 기차를 놓칠지도 몰라요.',['Мы точно опоздаем на поезд.','Может случиться так, что мы опоздаем на поезд.','Я не знал, что мы опоздали на поезд.'],1,'지도 모르다 сохраняет неопределённость: поезд ещё можно успеть, но есть риск. -ㄹ걸요 звучало бы как более уверенный прогноз.'],\n['Найдите неуместное','appear','Подруга смотрит на расписание автобусов и делает вывод: «Автобус, похоже, уже уехал». Вариант звучит неестественно.',['버스가 벌써 떠난 모양이에요.','버스가 벌써 떠나 보이네요.','버스가 벌써 떠났나 봐요.'],1,'떠나 보이다 описывает впечатление от внешнего вида, обычно видимое качество. Об отъезде судят по расписанию/обстоятельствам: 떠난 모양이다 естественно.'],\n['Естественная реплика','teda','Ты решил подготовиться к экзамену и говоришь себе: «На этот раз я точно буду заниматься каждый день!»',['이번에는 매일 공부할 테다!','이번에는 매일 공부할지도 몰라!','이번에는 매일 공부하는 모양이야!'],0,'-ㄹ 테다 выражает твёрдое намерение самого говорящего. 지도 모르다 — неопределённость, а 모양이다 не подходит для собственного решения.'],\n['Заполните пропуск','tenikka','제가 자료를 먼저 ___, 여러분은 잠시 쉬세요.','Я сначала подготовлю материалы, так что вы пока отдохните.',['준비할 테니까','준비할걸요','준비할지도 몰라요'],0,'-ㄹ 테니까 связывает обещанное действие с просьбой/советом. -ㄹ걸요 было бы отдельной догадкой, без причинной связки.'],\n['Смысл диалога','jul','가: 한국에 처음 왔어요? 나: 네, 겨울이 이렇게 추울 줄 몰랐어요.',['Раньше говорящий не знал, что зима здесь такая холодная.','Говорящий надеется, что зима будет холодной.','Говорящий видит, что собеседник замёрз.'],0,'-ㄹ 줄 몰랐다 показывает неожиданное открытие относительно прежнего знания. Для внешнего впечатления было бы 추워 보여요.'],\n['Точный перевод','shape','식탁에 음식이 많이 남아 있어요. 손님들이 많이 안 온 모양이에요.',['Гости, должно быть, пришли раньше.','Похоже, пришло не так много гостей.','Возможно, гости придут позже.'],1,'Оставшаяся еда служит основанием для вывода. 지도 모르다 обозначило бы лишь возможность без такого заключения.'],\n['Найдите неуместное','tenikka','Коллега хочет предложить: «Я проверю файл, так что пока подождите». Где грамматика выбрана не по функции?',['제가 파일을 확인할 테니까 잠시 기다려 주세요.','제가 파일을 확인할걸요, 잠시 기다려 주세요.','파일을 확인할 테니 잠깐만 기다려 주세요.'],1,'Здесь первое действие — основание для просьбы; нужно -ㄹ 테니까/-ㄹ 테니. -ㄹ걸요 передаёт предположение, а не связку-причину.'],\n['Естественная реплика','appear','Мама видит, что у сына мокрая куртка и растрёпанные волосы. Какое замечание о его виде звучит естественно?',['밖에 비가 오는 모양이구나.','많이 뛰어와서 힘들어 보여.','늦을지도 모르겠구나.'],1,'힘들어 보여 описывает видимое состояние сына. Остальные варианты делают вывод о погоде или вероятности опоздания.'],\n['Заполните пропуск','geol','가: 지금 출발하면 약속 시간에 늦을까요? 나: 길이 안 막히면 제시간에 도착할___ .',['테다','걸요','지도 몰라요'],1,'Собеседник даёт мягкий прогноз: 도착할걸요. 지도 몰라요 здесь сообщало бы о риске, а не успокаивающем предположении.'],\n['Смысл диалога','jido','가: 유나 씨가 아직 안 왔네요. 나: 길을 잘못 들었을지도 몰라요.',['Говорящий предполагает одну возможную причину задержки.','Говорящий по очевидным следам заключил, что она заблудилась.','Говорящий раньше не знал дорогу.'],0,'지도 모르다 называет возможную причину, не утверждая, что она верна. 모양이다 звучало бы как вывод по признакам.'],\n['Точный перевод','teda','내가 반드시 이 문제를 해결할 테다.',['Возможно, я решу эту проблему.','Кажется, эту проблему уже решили.','Я непременно решу эту проблему.'],2,'Твёрдое личное решение передаёт -ㄹ 테다. Для неуверенной возможности было бы 해결할지도 모르다.'],\n['Найдите неуместное','jul','Увидев, что обычно тихий друг отлично поёт, вы удивляетесь: «Не знал, что ты так хорошо поёшь!»',['네가 노래를 이렇게 잘 부를 줄 몰랐어.','네가 노래를 이렇게 잘 부르는 모양이야.','네가 노래를 이렇게 잘 부를 줄은 몰랐어.'],1,'Речь о неожиданном открытии — 잘 부를 줄 몰랐다. 모양이다 выводит факт по признакам, но не передаёт удивление «не знал».'],\n['Естественная реплика','shape','Из квартиры доносится запах свежего хлеба. Какой вывод естественен?',['누가 빵을 굽고 있는 모양이에요.','누가 빵을 구워 보여요.','누가 빵을 구울 테다.'],0,'Запах — косвенный признак текущего действия: 굽고 있는 모양이다. 보이다 описывает внешность, а 테다 — намерение говорящего.'],\n['Заполните пропуск','appear','새로 산 가방이 정말 ___ .','Новая сумка выглядит действительно дорогой.',['비싼 모양이에요','비싸 보여요','비쌀지도 몰라요'],1,'Сумка прямо выглядит дорогой — 비싸 보여요. 모양이다 был бы выводом о цене по более широким обстоятельствам.'],\n['Смысл диалога','tenikka','가: 여기서 기다릴까요? 나: 제가 택시를 부를 테니까 건물 앞에 있어요.',['«Возможно, я вызову такси» — просто предположение.','«Я вызову такси, поэтому подождите у здания» — основание для просьбы.','«Я не знал, что вызвал такси».'],1,'Тесная связь между действием и инструкцией выражается через -ㄹ 테니까. -ㄹ지도 모르다 не обосновал бы просьбу.'],\n['Точный перевод','geol','그 식당은 주말에 사람이 많을걸요.',['Думаю, в выходные в том ресторане будет много людей.','В выходные в ресторане обязательно будет много людей, потому что я так решил.','Не знал, что в выходные в ресторане много людей.'],0,'-을걸요 — предположение с некоторой уверенностью. Намерение/решение говорящего выражало бы 테다.'],\n['Найдите неуместное','jido','Друг говорит о прогнозе погоды: «Завтра, возможно, будет дождь». Какой вариант слабее соответствует осторожной возможности?',['내일 비가 올지도 몰라.','내일 비가 올걸.','내일 비가 올 수도 있어.'],1,'올걸 передаёт более уверенный прогноз или мягкое возражение. Для открытой возможности подходят 올지도 몰라 и 올 수도 있어.'],\n['Естественная реплика','jul','Коллега неожиданно свободно говорит по-русски. Как отреагировать: «Не знал, что вы говорите по-русски»?',['러시아어를 할 줄 몰랐어요.','러시아어를 하는 모양이에요.','러시아어를 할지도 몰라요.'],0,'Открытие о навыке выражает -는 줄 몰랐다. 모양이다 — внешний вывод; 지도 모르다 — только вероятность.'],\n['Заполните пропуск','shape','회의실에 아무도 없고 불도 꺼져 있어요. 회의가 ___ .',['끝난 모양이에요','끝나 보여요','끝날 테다'],0,'Пустая тёмная комната — признаки, по которым заключают, что встреча закончилась. -아/어 보이다 не сочетается здесь с событием «закончиться».'],\n['Смысл диалога','appear','가: 이 옷 어때? 나: 색이 잘 어울리고 훨씬 날씬해 보여.',['Одежда, вероятно, сделала тебя стройнее по косвенным фактам.','Ты выглядишь гораздо стройнее.','Возможно, ты станешь стройнее.'],1,'Собеседник описывает впечатление от внешнего вида сейчас: 날씬해 보여. 지도 모르다 обозначает возможность в будущем.'],\n['Точный перевод','tenikka','제가 주소를 문자로 보낼 테니까 확인해 보세요.',['Я, возможно, отправлю адрес; проверьте.','Я отправлю адрес, так что проверьте сообщение.','Я думал, что отправил адрес.'],1,'-ㄹ 테니까 обозначает ожидаемое действие как основание для просьбы. -ㄹ지도 모르다 оставило бы отправку неопределённой.'],\n['Найдите неуместное','geol','Друг считает, что кафе ещё открыто и отвечает на вопрос: «Оно же, наверное, открыто?» Выберите наиболее неуместный вариант.',['아직 문을 열었을걸요.','아직 영업할걸요.','아직 영업하는 모양이에요.'],2,'В коротком ответе как мягкое предположение естественно 영업할걸요. 모양이다 требует основания/наблюдения и здесь меняет оттенок на вывод по признакам.'],\n['Естественная реплика','jido','Метеоролог говорит, что траектория тайфуна ещё не ясна. Что точнее?',['태풍이 북쪽으로 갈지도 몰라요.','태풍이 북쪽으로 가는 모양이에요.','태풍이 북쪽으로 갈 테다.'],0,'Неопределённый прогноз — возможность, поэтому 지도 모르다. 모양이다 предполагает уже имеющиеся признаки, 테다 — намерение или твёрдую волю.'],\n['Заполните пропуск','jul','생각보다 발표 시간이 짧을 ___ 준비를 많이 못 했어요.','Я думал, что выступление будет короче, поэтому мало подготовился.',['줄 알고','모양이고','테니까'],0,'-(으)ㄹ 줄 알다 описывает прежнее ожидание, которое повлияло на подготовку. 모양이다 — текущий вывод, 테니까 — основание для просьбы/действия.'],\n['Смысл диалога','teda','가: 내일도 야근해야 해요? 나: 오늘 일을 다 끝내고 갈 테다.',['Говорящий решительно намерен закончить работу сегодня перед уходом.','Говорящий предполагает, что работа уже закончена.','Говорящий не знал, что сегодня придётся работать.'],0,'Первое лицо и волевое решение поддерживают -ㄹ 테다. Вероятность о внешнем факте выражалась бы 모양이다 или 걸요.'],\n['Точный перевод','appear','국이 너무 짜 보여요. 물을 조금 더 넣을까요?',['Суп, кажется, уже пересолили, судя по рецепту.','Суп выглядит слишком солёным. Добавить воды?','Возможно, суп будет солёным.'],1,'Видимая оценка блюда — 짜 보여요. Для вывода о уже случившемся пересоле по обстоятельствам подошло бы 짠 모양이에요.'],\n['Найдите неуместное','shape','Вы видите, что на полу следы снега и мокрые зонты. Хотите сказать: «Похоже, люди только что вошли с улицы».',['사람들이 방금 들어온 모양이에요.','사람들이 방금 들어와 보여요.','밖에서 사람들이 들어왔나 봐요.'],1,'Судим по следам и зонтам, значит нужен вывод 모양이다/나 보다. 들어와 보이다 неестественно описывает вид события.'],\n['Естественная реплика','geol','가: 이 문제, 오늘 안에 다 풀 수 있을까요? 나: 지금 속도면 충분히 풀 수 있을걸요.',['Утверждает как личное решение: «непременно решу».','Мягко предполагает, что времени достаточно.','Не знал, что задачу можно решить.'],1,'걸요 — прогноз собеседнику на основе текущего темпа. Намерение самого говорящего выражалось бы 풀 테다.'],\n['Заполните пропуск','tenikka','제가 아이들을 데리러 ___, 먼저 식사하세요.','Я съезжу за детьми, так что поешьте без меня.',['갈 테니까','갈걸요','갈지도 몰라요'],0,'갈 테니까 объясняет просьбу будущим действием говорящего. 갈걸요 — прогноз, а 갈지도 몰라요 не обещает, что он поедет.'],\n['Смысл диалога','shape','가: 왜 불을 켜 놓고 나갔지? 나: 급하게 나간 모양이야.',['По оставленному свету собеседник заключает, что человек ушёл в спешке.','Человек выглядит торопливым.','Возможно, собеседник сам уйдёт в спешке.'],0,'Оставленный свет — косвенный признак прошлого действия; 모양이다 выражает вывод. 보이다 описывает внешний вид.'],\n['Точный перевод','jul','그분이 한국어를 전혀 못할 줄 알았는데 아주 잘하시네요.',['Я думал, что он совсем не знает корейского, но он говорит отлично.','Возможно, он совсем не знает корейского.','Он выглядит так, будто не знает корейского.'],0,'-ㄹ 줄 알았다 — прежнее ожидание, которому противоречит реальность. Для предположения без такого контраста было бы 걸요.'],\n['Найдите неуместное','teda','Вы говорите о личном решении: «Я в следующем месяце начну бегать». Какое окончание меняет смысл на возможность?',['다음 달부터 달릴 테다.','다음 달부터 달릴지도 몰라.','다음 달부터 달리겠다.'],1,'달릴지도 몰라 — «может быть, начну», без решения. Твёрдое намерение выражает 테다 или 겠다.'],\n['Естественная реплика','appear','Сотрудник выглядит бледным и держится за голову. Что сказать?',['어디 아파 보여요.','어디 아픈 모양이에요.','어디 아플지도 몰라요.'],0,'Бледность и выражение лица дают впечатление о состоянии человека — 아파 보여요. 모양이다 больше подчёркивает вывод по обстоятельствам.'],\n['Заполните пропуск','geol','가: 이 가게, 예약 안 해도 자리가 있을까요? 나: 평일이라 자리가 ___ .',['있을걸요','있을 테다','있는 줄 몰랐어요'],0,'Ответ — мягкий прогноз: 자리 있을걸요. 테다 звучал бы как собственная решимость, 줄 몰랐다 — удивление о прежнем знании.'],\n['Смысл диалога','tenikka','가: 먼저 들어가도 돼요? 나: 네, 저는 좀 더 일할 테니까 먼저 가세요.',['«Наверное, я ещё поработаю» как догадка.','«Я ещё поработаю, поэтому идите первым» — разрешение с основанием.','«Я не знал, что ещё работаю».'],1,'Тесная связь между обещанным действием и разрешением выражена -ㄹ 테니까. -ㄹ걸요 не связывает его с просьбой.'],\n['Точный перевод','jido','열차가 늦어지면 약속에 늦을지도 몰라요.',['Если поезд задержится, возможно, я опоздаю на встречу.','Я точно опоздаю на встречу, потому что поезд задержался.','Я не знал, что опоздал на встречу.'],0,'Условие создаёт возможный риск, не свершившийся факт. 지도 모르다 сохраняет вероятность; 모양이다 делал бы вывод о текущей ситуации.'],\n['Найдите неуместное','jul','Вы узнали, что тихая однокурсница победила в конкурсе речи. Что не передаёт удивление «Не думал, что она победит»?',['그 친구가 우승할 줄 몰랐어요.','그 친구가 우승할 줄 알았어요.','그 친구가 우승할 줄은 몰랐어요.'],1,'알았어요 означает, что вы ожидали победу. Для удивления из-за неожиданного результата нужно 몰랐어요.'],\n['Естественная реплика','shape','На столе раскрытый учебник и конспект; сосед не отвечает. Как предположить, чем он занят?',['공부하고 있는 모양이에요.','공부해 보여요.','공부할 테다.'],0,'Учебник и конспект — основания предположить текущее занятие: 공부하고 있는 모양이다. 보이다 описывает впечатление от человека, 테다 — намерение говорящего.'],\n['Заполните пропуск','appear','아기가 아주 편안하게 ___ .','Малыш выглядит очень спокойным.',['자는 모양이에요','잘지도 몰라요','잘 것 같아 보여요'],2,'Для видимого впечатления естественно 편안해 보여요 / 편안하게 보여요. Из данных вариантов лишь 것 같아 보여요 передаёт это; 모양이다 — вывод о самом факте сна.'],\n['Смысл диалога','geol','가: 지금 가면 표를 살 수 있을까요? 나: 아직 매진은 아닐걸요.',['Говорящий мягко считает, что билеты, вероятно, ещё не распроданы.','Говорящий вывел это по пустой кассе.','Говорящий обещает лично купить билеты.'],0,'Отрицательное предположение в ответе выражается 아닐걸요. 모양이다 потребовало бы наблюдаемых оснований, а обещание — 테니까.'],\n['Точный перевод','teda','이번 프로젝트는 내가 책임지고 끝낼 테다.',['Может быть, я возьму ответственность за проект.','Я возьму ответственность и обязательно доведу этот проект до конца.','Похоже, проект уже завершён.'],1,'Говорящий объявляет твёрдое намерение. 지도 모르다 было бы неуверенной возможностью, 모양이다 — выводом о факте.'],\n['Найдите неуместное','appear','Врач оценивает самочувствие по симптомам и говорит: «Похоже, это аллергия». Какой вариант не передаёт вывод по симптомам?',['알레르기인 모양이에요.','알레르기일지도 몰라요.','알레르기여 보여요.'],2,'여 보여요 здесь грамматически неестественно. Для осторожного диагноза подойдут 모양이에요 или 지도 몰라요; 보이다 обычно образует прилагательное + 아/어 보이다.'],\n['Естественная реплика','jido','План поездки пока не решён. Как сообщить: «Возможно, мы поедем в Пусан»?',['부산에 갈지도 몰라요.','부산에 가는 모양이에요.','부산에 갈 테다.'],0,'План открыт — возможное развитие, 지도 모르다. 모양이다 выводило бы поездку из признаков, 테다 заявляло бы твёрдое намерение.'],\n['Заполните пропуск','shape','숙제를 다 했다고 했는데 책상에 답안지가 그대로 있어요. 아직 제출하지 ___ .',['않은 모양이에요','않아 보여요','않을 테다'],0,'Оставшийся бланк — признак того, что работу, похоже, не сдали. 보이다 описывает вид, а 테다 выражает собственное намерение.'],\n['Смысл диалога','jul','가: 이 식당 음식이 이렇게 매울 줄 알았어요? 나: 아니요, 하나도 안 매울 줄 알았어요.',['Говорящий ожидал, что еда совсем не будет острой.','Говорящий сейчас предполагает, что еда будет неострой.','Говорящий выглядит удивлённым остротой.'],0,'-ㄹ 줄 알았어요 — прежнее ожидание; вопрос соотносит его с реальной остротой. Для текущей догадки употребили бы 안 매울걸요.'],\n['Точный перевод','appear','이 신발은 오래 걸어도 편해 보여요.',['Эта обувь кажется удобной даже для долгой ходьбы.','Похоже, обувь уже разношена, потому что вы много ходили.','Возможно, обувь станет удобной.'],0,'편해 보여요 — визуальное впечатление. Для вывода о прошлом опыте потребовался бы контекст и 모양이다.'],\n['Найдите неуместное','tenikka','Вам нужно сказать: «Я напишу, когда доберусь, так что не волнуйся».',['도착하면 연락할 테니까 걱정하지 마.','도착하면 연락할걸, 걱정하지 마.','도착하면 연락할 테니 걱정하지 마.'],1,'Обещание служит основанием для просьбы не волноваться: 테니까/테니. 연락할걸 — предположение «наверное, напишу», звучит слабее обещания.'],\n['Естественная реплика','geol','가: 오늘 회식에 팀장님도 오세요? 나: 중요한 회의가 없으면 오실걸요.',['Если нет важной встречи, думаю, руководитель придёт.','Руководитель выглядит так, будто придёт.','Я решительно заставлю руководителя прийти.'],0,'Условный прогноз собеседнику естественно завершить -실걸요. Намерение говорящего или внешний вид здесь не подходят.'],\n['Заполните пропуск','jido','그 배우는 촬영 때문에 오늘 모임에 못 ___ .','Возможно, актёр сегодня не сможет прийти на встречу из-за съёмок.',['올지도 몰라요','오는 모양이에요','올 테다'],0,'Невозможность прийти — предположение о возможном исходе: 못 올지도 몰라요. 모양이다 означало бы вывод по признакам, 테다 — намерение говорящего.'],\n['Смысл диалога','teda','가: 누가 발표 자료를 만들 거예요? 나: 제가 오늘 밤까지 다 만들 테다.',['Говорящий обещает/решительно берётся закончить материалы.','Говорящий предполагает, что материалы уже готовы.','Говорящий не знал, кто будет делать материалы.'],0,'Первое лицо плюс конкретный срок передают решительное намерение. -ㄹ걸요 было бы прогнозом, а не обещанием.'],\n['Точный перевод','shape','현관에 신발이 여러 켤레 놓여 있어요. 손님이 온 모양이에요.',['Похоже, пришли гости: у входа стоит несколько пар обуви.','Гости выглядят так, будто пришли.','Возможно, гости когда-нибудь придут.'],0,'Обувь у входа — явное основание для вывода о приходе гостей. 지도 모르다 не связывает вывод с наблюдаемым признаком.'],\n['Найдите неуместное','geol','Вы отвечаете другу: «Думаю, завтра экзамен будет несложным». Какой вариант означает личное твёрдое обещание, а не прогноз?',['시험이 어렵지 않을걸요.','시험이 어렵지 않을 테다.','시험이 어렵지 않을지도 몰라요.'],1,'테다 звучит как волевое решение/твёрдое заявление говорящего; о вероятности будущего собеседнику естественнее 어렵지 않을걸요. 지도 몰라요 — менее уверенно.'],\n['Естественная реплика','jul','Вы впервые пробуете блюдо и удивляетесь: «Не знал, что кимчи так хорошо сочетается с сыром».',['김치가 치즈와 이렇게 잘 어울릴 줄 몰랐어요.','김치가 치즈와 이렇게 잘 어울리는 모양이에요.','김치가 치즈와 이렇게 잘 어울릴걸요.'],0,'Неожиданное открытие о сочетании — 줄 몰랐다. 모양이다 — вывод по признакам, 걸요 — предположение собеседнику.'],\n['Заполните пропуск','tenikka','밖이 추울 ___ 따뜻한 옷을 입고 나가세요.','На улице, наверное, холодно, так что наденьте тёплую одежду.',['테니까','걸요','지도 모르다'],0,'Совет подкреплён ожидаемым холодом: 추울 테니까. 걸요 завершил бы отдельное предположение, а не связал его с советом.'],\n['Смысл диалога','appear','가: 새 안경 어때요? 나: 인상이 훨씬 부드러워 보여요.',['Новые очки делают впечатление заметно мягче на вид.','Вероятно, характер собеседника изменился.','Может быть, очки стали мягкими.'],0,'부드러워 보여요 описывает визуальное впечатление об образе. 모양이다 говорил бы о выводе по обстоятельствам, не о том, как выглядит человек.'],\n['Точный перевод','geol','벌써 출발했으니 지금쯤 도착했을걸요.',['Раз уже выехали, думаю, к этому времени они добрались.','Возможно, они когда-нибудь доберутся.','Я решил, что они доберутся.'],0,'걸요 даёт мягкий прогноз с опорой на время в пути. 지도 모르다 менее уверенно, 테다 звучало бы как намерение говорящего.']\n];\nconst questions=raw.map((r,i)=>{if(r.length===6)r.splice(3,0,'');return {n:i+1,type:r[0],id:r[1],prompt:r[2],context:r[3]||'',opts:r[4],answer:r[5],why:r[6]}});\nlet state={screen:'review',index:0,order:questions.map((_,i)=>i),answers:[],retry:false};\ntry{const saved=JSON.parse(localStorage.getItem('hangulPredictions'));if(saved&&Array.isArray(saved.answers)&&saved.answers.length<50){state={...state,...saved,screen:'review'}}}catch{}\nconst app=document.getElementById('app');function save(){try{localStorage.setItem('hangulPredictions',JSON.stringify(state))}catch{}}\nfunction start(retry=false){state.retry=retry;if(!retry){state.order=questions.map((_,i)=>i);state.answers=[]}else{state.order=state.answers.map((a,i)=>a&&!a.correct?state.order[i]:null).filter(x=>x!==null);state.answers=[]}state.index=0;state.screen=state.order.length?'quiz':'result';save();render()}\nfunction render(){if(state.screen==='review')renderReview();else if(state.screen==='quiz')renderQuiz();else renderResult()}\nfunction renderReview(){app.innerHTML=`<section class=\"panel\"><div class=\"hero\"><div><div class=\"eyebrow\">Короткое ревью · 7 конструкций</div><h1>Как сказать<br>«похоже» по-корейски?</h1><p>Сначала быстро освежи оттенки, затем потренируйся выбирать форму по ситуации: что ты видишь, о чём заключаешь и насколько уверен.</p></div><div class=\"bubble\">🌸</div></div><div class=\"review\"><div class=\"revrow head\"><div>Форма</div><div>Значение и оттенок</div><div>Пример</div></div>${grammars.map(g=>`<div class=\"revrow\"><div class=\"gram\">${g.g}</div><div class=\"meaning\">${g.meaning}<div class=\"muted\">${g.shade}</div></div><div class=\"example\"><div class=\"ko\">${g.ex}</div><div class=\"translation\">${g.ru}</div></div></div>`).join('')}</div><div class=\"introline\"><span class=\"muted\">50 вопросов · смешанные форматы · можно продолжить позже</span><button class=\"btn primary\" onclick=\"start()\">Начать практику&nbsp; →</button></div></section>`}\nfunction renderQuiz(){const q=questions[state.order[state.index]],total=state.order.length,answered=state.answers[state.index],pct=Math.round(state.index/total*100);app.innerHTML=`<section class=\"panel\"><div class=\"introline\"><span class=\"eyebrow\">${state.retry?'Повтор ошибок':'Смешанная практика'}</span><span class=\"muted\">${state.index+1} / ${total}</span></div><div class=\"progress\"><span style=\"width:${pct}%\"></span></div><div class=\"qmeta\"><span class=\"chip\">${q.type}</span><span class=\"chip\">${grammars.find(g=>g.id===q.id).g}</span></div><h2 class=\"qtitle\">${q.prompt}</h2>${q.context?`<p class=\"context\">${q.context}</p>`:''}<div class=\"options\">${q.opts.map((o,i)=>`<button class=\"option ${answered?(i===q.answer?'correct':i===answered.choice?'wrong':''):''}\" ${answered?'disabled':''} onclick=\"choose(${i})\"><span class=\"letter\">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div><div class=\"feedback ${answered&&!answered.correct?'bad':''}\" style=\"display:${answered?'block':'none'}\"><strong>${answered?(answered.correct?'Верно!':'Пока нет — правильный ответ: '+String.fromCharCode(65+q.answer)) : ''}</strong>${answered?q.why:''}</div><div class=\"controls\"><button class=\"btn soft\" onclick=\"goReview()\">К ревью</button>${answered?`<button class=\"btn primary right\" onclick=\"next()\">${state.index+1===total?'Результат':'Следующий вопрос'} →</button>`:''}</div></section>`}\nfunction choose(i){if(state.answers[state.index])return;const q=questions[state.order[state.index]];state.answers[state.index]={choice:i,correct:i===q.answer,id:q.id};save();renderQuiz()}\nfunction next(){if(state.index+1<state.order.length)state.index++;else state.screen='result';save();render()}\nfunction goReview(){state.screen='review';save();render()}\nfunction renderResult(){let right=state.answers.filter(a=>a&&a.correct).length,total=state.order.length;let stats=grammars.map(g=>{let ix=state.order.map((n,i)=>({n,i})).filter(x=>questions[x.n].id===g.id).map(x=>x.i);let ok=ix.filter(i=>state.answers[i]?.correct).length;return{g,ok,n:ix.length}});let wrong=state.answers.map((a,i)=>({a,q:questions[state.order[i]]})).filter(x=>x.a&&!x.a.correct);app.innerHTML=`<section class=\"panel\"><div class=\"resulthead\"><div class=\"eyebrow\">Практика завершена</div><div class=\"score\">${right}<span style=\"font-size:27px;color:#9e8194\"> / ${total}</span></div><div class=\"stats\">правильных ответов</div><h1 style=\"font-size:27px;margin:17px 0 4px\">${right===total?'Прекрасно!':right>=Math.ceil(total*.75)?'Уверенное владение!':right>=Math.ceil(total*.5)?'Хорошая база — закрепи оттенки.':'Есть что повторить — это нормальная часть учёбы.'}</h1></div><h3>Результат по грамматикам</h3><div class=\"results\">${stats.map(s=>`<div class=\"resultrow\"><div><strong>${s.g.g}</strong><span>${s.ok} / ${s.n}</span></div><div class=\"mini\"><span style=\"width:${s.n?Math.round(s.ok/s.n*100):0}%\"></span></div></div>`).join('')}</div><div class=\"controls\"><button class=\"btn soft\" onclick=\"goReview()\">Вернуться к ревью</button><button class=\"btn primary right\" onclick=\"start()\">Пройти заново ↻</button></div><div class=\"wronglist\"><h3>Ошибки для разбора · ${wrong.length}</h3>${wrong.length?wrong.map(({q,a})=>`<div class=\"wrongitem\"><b>${q.type}:</b> ${q.prompt}<br><span class=\"muted\">${q.why}</span></div>`).join(''):'<div class=\"empty\">Ошибок нет — отлично!</div>'}<div style=\"margin-top:14px\">${wrong.length?'<button class=\"btn soft\" onclick=\"start(true)\">Повторить ошибки</button>':''}</div></div></section>`;}\nrender();\n<\/script></body></html>\r\n\r\n",contrast:"<!doctype html><html lang=\"ru\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Хангыль Lab — противопоставление</title><style>\n:root{--ink:#38283a;--muted:#806d80;--line:#f0dce5;--pink:#e77da8;--shadow:0 18px 55px #75445b1b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.55 system-ui,\"Segoe UI\",sans-serif;background:radial-gradient(ellipse at 10% 5%,#ffe4ee,transparent 36%),radial-gradient(ellipse at 95% 35%,#f2e4fb,transparent 35%),linear-gradient(140deg,#fff8fa,#fff1f6 55%,#f9f1fb);min-height:100vh}.wrap{max-width:940px;margin:auto;padding:28px 18px 60px}.top{font-weight:850;margin-bottom:22px}.top i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#fff;color:#d36998;font-style:normal;margin-right:8px;box-shadow:0 5px 15px #bd6b9130}.panel{background:#ffffffdf;border:1px solid #fff;border-radius:26px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow);backdrop-filter:blur(10px);animation:up .35s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{color:#c36691;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,45px);line-height:1.1;letter-spacing:-.035em;margin:10px 0}p{color:var(--muted)}.table{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:24px 0}.row{display:grid;grid-template-columns:210px 1fr 1.1fr;gap:15px;padding:14px 16px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row.h{background:#fff5f8;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.g{font-weight:800;color:#754c79}.meaning{font-size:14px}.example{font-size:14px}.ko{font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",sans-serif;font-size:17px;font-weight:700;color:#57345f}.translation{font-size:13px;color:var(--muted)}.btn{font:inherit;font-weight:750;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;transition:.16s transform}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(120deg,#e47ba7,#bd72b5);color:white;box-shadow:0 9px 20px #cc73a442}.soft{background:#f9eaf2;color:#85547d}.bar{height:9px;background:#f5e5ec;border-radius:20px;overflow:hidden;margin:8px 0 23px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ee9ab8,#bc84c4);transition:width .25s}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{font-size:13px;color:var(--muted)}.chips{display:flex;gap:8px;margin:10px 0}.chip{border-radius:99px;padding:5px 10px;background:#fff0f5;color:#a7547c;font-size:12px;font-weight:750}.question{font-size:clamp(21px,3vw,27px);line-height:1.35;margin:12px 0 8px}.options{display:grid;gap:10px;margin-top:22px}.option{padding:13px 15px;border:1.5px solid var(--line);background:white;border-radius:15px;color:var(--ink);text-align:left;font:inherit;cursor:pointer}.option:hover:not(:disabled){border-color:#dd91b1;background:#fff8fb}.option:disabled{cursor:default}.option.correct{border-color:#63b59c;background:#edfaf5}.option.wrong{border-color:#df8394;background:#fff1f3}.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;background:#f8edf3;color:#9a6286;font-weight:800;font-size:13px;margin-right:9px}.feedback{display:none;border-radius:15px;padding:15px;margin-top:16px;background:#eff9f5;border:1px solid #d4eee4}.feedback.bad{background:#fff3f4;border-color:#f4d6dc}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:21px}.score{font-size:57px;font-weight:850;color:#bd6796;letter-spacing:-.05em;text-align:center}.center{text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat strong{display:block;font-size:14px}.mini{height:6px;background:#f5e8ee;border-radius:9px;margin-top:8px;overflow:hidden}.mini span{display:block;height:100%;background:linear-gradient(90deg,#ec99b7,#bd83c5)}.mistakes{border-top:1px solid var(--line);padding-top:12px;margin-top:25px}.mistake{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.foot{text-align:center;color:#9b8494;font-size:12px;margin-top:20px}@media(max-width:650px){.row{grid-template-columns:1fr;gap:4px;padding:12px 14px}.row.h{display:none}.example{border-top:1px dashed var(--line);padding-top:6px}.stats{grid-template-columns:1fr}.wrap{padding:18px 12px 40px}.panel{border-radius:21px}}\n</style></head><body><div class=\"wrap\"><div class=\"top\"><i>ㅎ</i> HANGUL LAB <span class=\"muted\">· грамматика</span></div><main id=\"app\"></main><div class=\"foot\">Прогресс сохраняется на этом устройстве</div></div><script>\nconst gs=[\n{id:'기는',g:'-기는 하지만 / -기는 -지만',m:'«Хотя и…, но…»; уступка с явным признанием первого факта.',s:'Часто говорящий соглашается с одной стороной, затем добавляет оговорку.',e:'이 식당은 맛있기는 하지만 조금 비싸요.','r':'В этом ресторане вкусно, хотя он немного дорогой.'},\n{id:'반면',g:'-(으)ㄴ/는 반면에',m:'«В то время как…, тогда как…»; сопоставление двух сторон.',s:'Подчёркивает различие между людьми, предметами или свойствами.',e:'언니는 조용한 반면에 동생은 활발해요.','r':'Старшая сестра спокойная, тогда как младшая активная.'},\n{id:'는데도',g:'-(으)ㄴ/는데도',m:'«Несмотря на то что…»; результат вопреки ожиданию.',s:'После условия обычно происходит не то, чего можно было ожидать.',e:'약을 먹었는데도 아직 아파요.','r':'Несмотря на то что я принял лекарство, мне всё ещё больно.'}\n];\n// [тип, грамматика, вопрос, контекст, варианты, индекс ответа, пояснение]\nconst raw=[\n['Выбор по ситуации','기는','Другу понравился фильм, но он затянут. Как сказать: «Фильм хороший, хотя немного длинный»?','Уступка: признаём достоинство и добавляем оговорку.',['영화가 좋기는 하지만 조금 길어요.','영화가 좋은 반면에 조금 길어요.','영화가 좋은데도 조금 길어요.'],0,'-기는 하지만 признаёт первый факт и уступает ему: хороший, но длинный. 반면에 сравнивает две стороны, а -는데도 подчёркивает неожиданный результат.'],\n['Заполните пропуск','반면','이 도시는 겨울에는 춥___ 여름에는 아주 더워요.','Зимой в этом городе холодно, тогда как летом очень жарко.',['기는 하지만','은 반면에','는데도'],1,'Здесь сопоставлены разные сезоны и их свойства, поэтому подходит 반면에. -기는 하지만 выражало бы уступку внутри одной оценки.'],\n['Смысл реплики','는데도','가: 왜 아직 기침해요? 나: 약을 먹었는데도 계속 기침이 나요.',['Лекарство помогло, поэтому кашель продолжается.','Несмотря на лекарство, кашель продолжается — результат вопреки ожиданию.','Лекарство дорогое, но эффективное.'],1,'Ожидаем, что лекарство поможет, однако кашель остаётся: -는데도 отмечает это несоответствие ожиданию.'],\n['Точный перевод','기는','바쁘기는 하지만 저녁에는 갈 수 있어요.',['Я занят, поэтому вечером не смогу прийти.','Я занят, но вечером всё-таки могу прийти.','Вечером я занят, тогда как днём свободен.'],1,'Сначала признаётся занятость, затем даётся уступающий вывод. 반면에 потребовало бы сравниваемых сторон.'],\n['Выбор формы','는데도','비가 많이 ___ 사람들이 야외 공연을 끝까지 봤어요.','Хотя шёл сильный дождь, люди досмотрели концерт на открытом воздухе до конца.',['오기는 하지만','오는 반면에','오는데도'],2,'Дождь обычно заставил бы уйти, но люди остались: неожиданное следствие требует -는데도.'],\n['Найдите точное','반면','Нужно сравнить двух коллег: один быстро работает, другой тщательно проверяет детали.',['민호 씨는 빠른 반면에 수진 씨는 꼼꼼해요.','민호 씨는 빠르기는 하지만 수진 씨는 꼼꼼해요.','민호 씨는 빠른데도 수진 씨는 꼼꼼해요.'],0,'Два человека и разные качества сопоставляются через 반면에. -기는 하지만 уступает внутри характеристики одного человека, -는데도 предполагает неожиданное следствие.'],\n['Заполните пропуск','기는','새 휴대전화는 가볍___ 배터리가 빨리 닳아요.','Новый телефон лёгкий, но батарея быстро садится.',['기는 하지만','은 반면에','는데도'],0,'Говорящий признаёт достоинство телефона и тут же оговаривает недостаток — типичное -기는 하지만.'],\n['Смысл реплики','반면','가: 두 형제는 성격이 비슷해요? 나: 형은 외향적인 반면에 동생은 내성적이에요.',['Братья разные: старший общительный, тогда как младший замкнутый.','Старший общительный, но ему трудно знакомиться.','Младший замкнутый, хотя старший тоже общительный.'],0,'반면에 сопоставляет характеры двух людей. Основной смысл — контраст, а не уступка или неожиданность.'],\n['Точный перевод','는데도','몇 번이나 설명했는데도 그는 아직 이해하지 못했어요.',['Он всё ещё не понял, хотя ему объясняли уже несколько раз.','Он понял, потому что ему несколько раз объяснили.','Несколько раз он объяснял, тогда как тот не слушал.'],0,'Повторное объяснение создаёт ожидание понимания, но результат обратный. Это ключевой оттенок -는데도.'],\n['Исправьте выбор','기는','Друг признаёт, что дорога красивая, но слишком далеко. Какой вариант естественнее?',['길이 예쁘기는 하지만 너무 멀어요.','길이 예쁜 반면에 너무 멀어요.','길이 예쁜데도 너무 멀어요.'],0,'Для уступки «красиво, однако далеко» естественно -기는 하지만. 반면에 обычно сопоставляет параллельные стороны, а -는데도 ожидалось бы неожиданное следствие.'],\n['Выбор по ситуации','반면','В одном районе аренда высокая, зато транспорт удобный; сравниваются две характеристики района.',['집세가 비싸기는 하지만 교통이 편리해요.','집세가 비싼 반면에 교통은 편리해요.','집세가 비싼데도 교통이 편리해요.'],1,'Две черты описываются как противоположные стороны, поэтому 반면에 хорошо связывает сравнение.'],\n['Заполните пропуск','는데도','열심히 연습했___ 무대에서 실수를 했어요.','Несмотря на усердные репетиции, на сцене я ошибся.',['기는 하지만','는 반면에','는데도'],2,'Репетиции обычно должны помочь выступить без ошибок, поэтому ошибка вопреки ожиданию сочетается с -는데도.'],\n['Смысл диалога','기는','가: 이 카페 어때요? 나: 분위기가 좋기는 한데 커피가 좀 비싸요.',['Кафе приятное, но кофе дороговат.','Кафе приятное, тогда как кофе там дешёвый.','Кофе дорогой несмотря на низкие цены.'],0,'-기는 한데 — разговорный вариант уступки: признаётся приятная атмосфера, затем следует оговорка.'],\n['Выберите связку','반면','아버지는 아침형 인간인 ___ 어머니는 밤늦게까지 깨어 있어요.',['반면에','는데도','기는 하지만'],0,'Сопоставляются привычки двух людей. 반면에 наиболее ясно показывает контраст; -는데도 означало бы результат вопреки ожиданию.'],\n['Точный смысл','는데도','길을 자세히 알려 줬는데도 친구가 다른 곳으로 갔어요.',['Я подробно объяснил дорогу, но друг всё равно пошёл не туда.','Я объяснил дорогу, потому что друг пошёл в другое место.','Друг пошёл не туда, тогда как я объяснял дорогу.'],0,'Объяснение должно было помочь, однако друг ошибся. Это несоответствие ожидаемому результату — -는데도.'],\n['Исправьте выбор','는데도','Несмотря на то что поезд задержали, пассажиры спокойно дождались его. Выберите подходящую форму.',['기차가 늦기는 하지만 승객들이 기다렸어요.','기차가 늦는 반면에 승객들이 기다렸어요.','기차가 늦었는데도 승객들이 차분히 기다렸어요.'],2,'Ожидание задержанного поезда неприятно, но пассажиры всё же спокойно ждут: -는데도 передаёт неожиданный результат.'],\n['Выбор по смыслу','기는','Оцениваете новую работу: зарплата хорошая, но дорога занимает много времени.',['월급이 좋기는 하지만 출퇴근 시간이 오래 걸려요.','월급이 좋은 반면에 출퇴근 시간이 오래 걸려요.','월급이 좋은데도 출퇴근 시간이 오래 걸려요.'],0,'Говорящий делает уступку: хорошая зарплата, однако есть минус. 반면에 можно употребить при сопоставлении, но здесь естественнее явная уступка -기는 하지만.'],\n['Заполните пропуск','반면','온라인 수업은 편리한 ___ 집중하기 어려울 때가 있어요.',['기는 하지만','반면에','는데도'],1,'Сравниваются два аспекта онлайн-занятий — удобство и сложность концентрации. 반면에 представляет их как две стороны.'],\n['Выберите продолжение','는데도','아이가 졸려 보이는데도…',['계속 놀고 있어요.','낮잠을 자는 반면에요.','졸리기는 하지만요.'],0,'Несмотря на сонливость, ребёнок продолжает играть — действие против ожидаемого.'],\n['Точный перевод','반면','서울은 대중교통이 편리한 반면에 집값이 높은 편이에요.',['В Сеуле удобный общественный транспорт, тогда как жильё довольно дорогое.','В Сеуле транспорт удобный, поэтому жильё дорогое.','Несмотря на дорогие дома, транспорт работает.'],0,'반면에 связывает контрастные характеристики города; причинной связи между ними предложение не утверждает.'],\n['Уступка или неожиданность','기는','Друг говорит: «Я понимаю, что задача трудная, но попробую решить». Что сказать?',['문제가 어렵기는 하지만 한번 풀어 볼게요.','문제가 어려운데도 한번 풀어 볼게요.','문제가 어려운 반면에 한번 풀어 볼게요.'],0,'Сначала признаётся трудность, а затем заявляется действие несмотря на неё. Вариант -는데도 больше подчёркивал бы результат вопреки ожиданию.'],\n['Заполните пропуск','는데도','그 식당은 평점이 낮___ 손님이 항상 많아요.','Хотя у ресторана низкий рейтинг, посетителей там всегда много.',['기는 하지만','은 반면에','은데도'],2,'Низкий рейтинг обычно не обещает много посетителей, но их много: неожиданный контраст ожиданию оформляется -는데도.'],\n['Смысл диалога','기는','가: 한국어 공부가 재미있어요? 나: 재미있기는 한데 문법이 어려워요.',['Учить корейский интересно, но грамматика трудная.','Грамматика трудная, поэтому учёба неинтересная.','Учёба интересная, тогда как грамматика лёгкая.'],0,'기는 한데 признаёт интерес и добавляет контрастную оговорку о грамматике.'],\n['Найдите подходящую форму','반면','Сравниваете два способа поездки: самолёт быстрый, поезд комфортнее.',['비행기는 빠른 반면에 기차는 더 편안해요.','비행기는 빠르기는 하지만 기차는 더 편안해요.','비행기는 빠른데도 기차는 더 편안해요.'],0,'Сравниваются самолёт и поезд как два варианта, поэтому 반면에.'],\n['Точный перевод','는데도','문을 잠갔는데도 바람에 문이 열렸어요.',['Я запер дверь, но она открылась от ветра.','Я запер дверь, потому что подул ветер.','Дверь была открыта, тогда как я запирал её.'],0,'Запертая дверь должна оставаться закрытой, но ветер её открыл. Результат вопреки ожиданию — -는데도.'],\n['Выберите точную реплику','기는','«Я не специалист, но немного разбираюсь в компьютерах».',['전문가는 아니기는 하지만 컴퓨터를 조금 알아요.','전문가가 아닌 반면에 컴퓨터를 조금 알아요.','전문가가 아닌데도 컴퓨터를 조금 알아요.'],0,'Говорящий уступчиво уточняет свою компетентность: не специалист, однако кое-что знает.'],\n['Заполните пропуск','반면','누나는 여행을 좋아하___ 남동생은 집에 있는 걸 더 좋아해요.',['기는 하지만','는 반면에','는데도'],1,'Разные предпочтения сестры и брата противопоставлены друг другу, значит 반면에.'],\n['Смысл реплики','는데도','가: 왜 아직 도착하지 않았어요? 나: 내비게이션을 켰는데도 길을 잘못 들었어요.',['Навигатор был включён, но говорящий всё равно свернул не туда.','Навигатор был включён, поэтому говорящий правильно приехал.','Говорящий включил навигатор, тогда как собеседник ошибся.'],0,'Включённый навигатор должен помочь, но ошибка всё же произошла. -는데도 маркирует это вопреки ожиданию.'],\n['Итоговый выбор','기는','Какой вариант выражает: «Этот ноутбук дорогой, но лёгкий» — признание цены с последующим плюсом?',['이 노트북은 비싸기는 하지만 가벼워요.','이 노트북은 비싼 반면에 가벼워요.','이 노트북은 비싼데도 가벼워요.'],0,'-기는 하지만 явно оформляет уступку: дорогой, однако лёгкий. -는데도 сильнее подчёркивало бы неожиданность лёгкости при высокой цене.']\n];\nconst qs=raw.map((r,i)=>({n:i+1,type:r[0],id:r[1],prompt:r[2],context:r[3],opts:r[4],ans:r[5],why:r[6]}));let st={screen:'review',i:0,answers:[],order:qs.map((_,i)=>i),retry:false};try{const x=JSON.parse(localStorage.getItem('hangulContrast'));if(x&&Array.isArray(x.answers)&&x.answers.length<qs.length)st={...st,...x,screen:'review'}}catch{}const app=document.getElementById('app');function save(){try{localStorage.setItem('hangulContrast',JSON.stringify(st))}catch{}}function begin(retry=false){st.retry=retry;if(retry){st.order=st.answers.map((a,i)=>a&&!a.ok?st.order[i]:null).filter(x=>x!==null);st.answers=[]}else{st.order=qs.map((_,i)=>i);st.answers=[]}st.i=0;st.screen=st.order.length?'quiz':'result';save();draw()}function review(){st.screen='review';save();draw()}function pick(n){if(st.answers[st.i])return;let q=qs[st.order[st.i]];st.answers[st.i]={choice:n,ok:n===q.ans};save();draw()}function next(){if(st.i+1<st.order.length)st.i++;else st.screen='result';save();draw()}\nfunction draw(){if(st.screen==='review'){app.innerHTML=`<section class=\"panel\"><div class=\"eyebrow\">Короткое ревью · 3 конструкции</div><h1>Контраст и уступка</h1><p>Различай три связи по тому, что делает говорящий: признаёт факт с оговоркой, сопоставляет две стороны или отмечает результат вопреки ожиданию.</p><div class=\"table\"><div class=\"row h\"><div>Форма</div><div>Значение и оттенок</div><div>Пример</div></div>${gs.map(x=>`<div class=\"row\"><div class=\"g\">${x.g}</div><div class=\"meaning\">${x.m}<div class=\"muted\">${x.s}</div></div><div class=\"example\"><div class=\"ko\">${x.e}</div><div class=\"translation\">${x.r}</div></div></div>`).join('')}</div><div class=\"line\"><span class=\"muted\">30 вопросов · выбор формы, диалоги и перевод</span><button class=\"btn primary\" onclick=\"begin()\">Начать практику →</button></div></section>`}else if(st.screen==='quiz'){let q=qs[st.order[st.i]],a=st.answers[st.i],total=st.order.length;app.innerHTML=`<section class=\"panel\"><div class=\"line\"><span class=\"eyebrow\">${st.retry?'Повтор ошибок':'Смешанная практика'}</span><span class=\"muted\">${st.i+1} / ${total}</span></div><div class=\"bar\"><span style=\"width:${Math.round(st.i/total*100)}%\"></span></div><div class=\"chips\"><span class=\"chip\">${q.type}</span><span class=\"chip\">${gs.find(g=>g.id===q.id).g}</span></div><h2 class=\"question\">${q.prompt}</h2>${q.context?`<p>${q.context}</p>`:''}<div class=\"options\">${q.opts.map((o,i)=>`<button class=\"option ${a?(i===q.ans?'correct':i===a.choice?'wrong':''):''}\" ${a?'disabled':''} onclick=\"pick(${i})\"><span class=\"letter\">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div><div class=\"feedback ${a&&!a.ok?'bad':''}\" style=\"display:${a?'block':'none'}\"><b>${a?(a.ok?'Верно!':'Правильный ответ: '+String.fromCharCode(65+q.ans)):''}</b><br>${a?q.why:''}</div><div class=\"controls\"><button class=\"btn soft\" onclick=\"review()\">К ревью</button>${a?`<button class=\"btn primary\" onclick=\"next()\">${st.i+1===total?'Итог':'Дальше →'}</button>`:''}</div></section>`}else result()}\nfunction result(){let correct=st.answers.filter(x=>x&&x.ok).length,total=st.order.length;let stats=gs.map(g=>{let indexes=st.order.map((n,i)=>i).filter(i=>qs[st.order[i]].id===g.id);return{g,n:indexes.length,ok:indexes.filter(i=>st.answers[i]?.ok).length}});let wrong=st.answers.map((a,i)=>({a,q:qs[st.order[i]]})).filter(x=>x.a&&!x.a.ok);app.innerHTML=`<section class=\"panel\"><div class=\"eyebrow center\">Практика завершена</div><div class=\"score\">${correct} <span class=\"muted\">/ ${total}</span></div><p class=\"center\">правильных ответов</p><div class=\"stats\">${stats.map(s=>`<div class=\"stat\"><strong>${s.g.g}</strong><span class=\"muted\">${s.ok} / ${s.n}</span><div class=\"mini\"><span style=\"width:${s.n?100*s.ok/s.n:0}%\"></span></div></div>`).join('')}</div><div class=\"line\"><button class=\"btn soft\" onclick=\"review()\">К ревью</button><button class=\"btn primary\" onclick=\"begin()\">Пройти заново ↻</button></div><div class=\"mistakes\"><h3>Ошибки · ${wrong.length}</h3>${wrong.length?wrong.map(({q})=>`<div class=\"mistake\"><b>${q.prompt}</b><br><span class=\"muted\">${q.why}</span></div>`).join(''):'<p>Ошибок нет — отлично!</p>'}${wrong.length?'<button class=\"btn soft\" style=\"margin-top:12px\" onclick=\"begin(true)\">Повторить ошибки</button>':''}</div></section>`}\ndraw();\n<\/script></body></html>\r\n"};function show(which){const f=document.getElementById('lesson');if(f.dataset.lesson!==which){f.srcdoc=docs[which];f.dataset.lesson=which}document.getElementById('pred').classList.toggle('active',which==='pred');document.getElementById('contrast').classList.toggle('active',which==='contrast');try{localStorage.setItem('hangulLabSection',which)}catch{}}let initial='pred';try{initial=localStorage.getItem('hangulLabSection')||'pred'}catch{}show(initial);</script></body></html>
